<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invitation de Mariage - Afefa & Christian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Lato', sans-serif;
      }
      .font-dancing {
        font-family: 'Dancing Script', cursive;
      }
      .font-playfair {
        font-family: 'Playfair Display', serif;
      }
      @keyframes subtle-pulse {
        0%, 100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.2);
        }
      }
      .is-visible .icon-to-pulse {
        animation: subtle-pulse 1.2s cubic-bezier(0.5, 0, 0.5, 1) 2;
        animation-delay: 1s;
      }
      @keyframes glow-cascade-in {
        0% {
          opacity: 0;
          transform: translateY(10px);
          text-shadow: 0 0 0px #B08D57;
        }
        50% {
          text-shadow: 0 0 15px #B08D57;
        }
        100% {
          opacity: 1;
          transform: translateY(0);
          text-shadow: 0 0 0px #B08D57;
        }
      }

      .is-visible .cascade-char {
        display: inline-block;
        opacity: 0;
        animation: glow-cascade-in 1s forwards;
      }
      .icon-glow:hover {
        filter: drop-shadow(0 0 8px #B08D57);
        transition: filter 0.3s ease-in-out;
      }
      @keyframes draw-check {
        from {
          stroke-dashoffset: 25;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      .animate-checkmark {
        stroke-dasharray: 25;
        stroke-dashoffset: 25;
        animation: draw-check 0.5s ease-in-out forwards;
      }
       @keyframes color-pulse {
        0%, 100% {
          transform: scale(1);
          box-shadow: 0 0 0px var(--glow-color);
        }
        50% {
          transform: scale(1.1);
          box-shadow: 0 0 15px var(--glow-color);
        }
      }
      .animate-color-pulse {
        animation: color-pulse 3s infinite ease-in-out;
      }
    </style>
